# Netlify：web/ をビルドして公開し、Claude API は Functions（サーバー側）で呼ぶ
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ローカル開発（netlify dev）：Vite を立ち上げ、/api/* を Functions に振り分ける
[dev]
  command = "npm run vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
