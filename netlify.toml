# Netlify：web/ をビルドして公開し、Claude API は Functions（サーバー側）で呼ぶ
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify のビルド環境の Node.js（Vite 7 は 20.19 以上が必要）
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ローカル開発（netlify dev）：Vite を立ち上げ、/api/* を Functions に振り分ける
[dev]
  command = "npm run vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# 3D（Unity WebGL）は Brotli で圧縮して置いてある。ブラウザ自身に解凍させるため Content-Encoding を付ける
[[headers]]
  for = "/unity/Build/*.wasm.unityweb"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/unity/Build/*.js.unityweb"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/unity/Build/*.data.unityweb"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=3600"

# ホーム画面に追加するときの情報（アイコンと名前）
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# 公開サイトがつなぐ先を、このサイト自身と、読み取りに使う部品の配信元（SheetJS・pdf.js）だけに限る。
# 手元のサーバーやローカルネットワーク（localhost・192.168.x.x など）へは、ブラウザが接続させない
# （「ローカルネットワーク上のデバイスへの接続」の確認も出ない）。
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "connect-src 'self' https://cdn.sheetjs.com https://cdnjs.cloudflare.com blob: data:"
