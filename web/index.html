<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蔵ツイン</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app">
  <section class="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <!-- 読み込み中の画面：白い漆喰の壁と木の梁の色。Unity のロゴは出さない -->
    <div id="unity-status" class="kura-loader" role="status">
      <div class="kura-loader-beam"></div>
      <div class="kura-loader-card">
        <div class="kura-loader-title">蔵ツイン</div>
        <div class="kura-loader-sub">経過簿から、杜氏の判断を蔵に残す</div>
        <div class="kura-loader-bar"><span id="loader-fill"></span></div>
        <div id="loader-text" class="kura-loader-text">蔵の戸を開けています…</div>
      </div>
    </div>
    <div id="toji-bubble" class="toji-bubble" hidden></div>
    <div id="time-badge" class="time-badge" aria-live="polite"></div>
    <div id="stage-hint" class="stage-hint" aria-hidden="true">ドラッグで回す・スクロールで寄る・タンクを押して近づく</div>
    <div class="stage-tools">
      <button id="cam-overview" type="button">蔵全体</button>
      <button id="cam-toji" type="button">杜氏の目線</button>
    </div>
  </section>

  <aside class="panel">
    <header class="masthead">
      <div class="brand">
        <h1>蔵ツイン</h1>
        <p id="kura-name" class="kura-name"></p>
      </div>
      <label class="season">
        <span class="sr-only">季</span>
        <select id="season-select" aria-label="季"></select>
      </label>
    </header>

    <section class="timeline" aria-label="日付とタンク">
      <div class="day">
        <output id="day-label" class="day-label"></output>
        <input id="day-slider" type="range" min="0" max="0" value="0" aria-label="日付">
      </div>
      <div id="tank-buttons" class="tanks" aria-label="タンク"></div>
    </section>

    <section id="tank-detail" class="tank-card" hidden></section>
    <section id="tank-summary" class="tank-summary" hidden>
      <h3 class="mini-head">今日の様子</h3>
      <div id="summary-out"></div>
    </section>

    <nav class="roles" role="tablist" aria-label="使う人">
      <button role="tab" data-tab="import" aria-selected="false"><span class="who">蔵人</span><span class="what">記録を読む</span></button>
      <button role="tab" data-tab="toji" aria-selected="true"><span class="who">杜氏</span><span class="what">理由を残す</span></button>
      <button role="tab" data-tab="young" aria-selected="false"><span class="who">若手</span><span class="what">杜氏に聞く</span></button>
    </nav>

    <section id="tab-import" class="tab-body" hidden>
      <p class="lead">経過簿の写真を選ぶと、Claude が読み取ります。</p>
      <label class="dropzone">
        <input id="import-file" type="file" accept="image/*,.xlsx,.xls">
        <span class="dz-main">写真か Excel を選ぶ</span>
        <span class="dz-sub">読めない欄は推測で埋めず「要確認」にします</span>
      </label>
      <p class="hint"><a href="sheet-template.html" target="_blank" rel="noopener">手書き用の経過簿の用紙</a></p>
      <div id="import-out"></div>
    </section>

    <section id="tab-toji" class="tab-body"></section>

    <section id="tab-young" class="tab-body chat" hidden>
      <div id="young-out" class="chat-log" aria-live="polite"></div>
      <div id="young-suggest" class="suggest"></div>
      <div class="composer">
        <textarea id="young-q" rows="2" placeholder="杜氏に聞きたいこと（例：追水したのはどんなとき？）"></textarea>
        <div class="composer-actions">
          <button id="young-mic" type="button" class="mic" hidden title="声で入力">声</button>
          <button id="young-ask" class="primary" type="button">聞く</button>
        </div>
      </div>
    </section>

    <footer class="foot">
      架空の蔵のデモデータです。<button id="reset-local" type="button" class="link">この端末の保存を消す</button>
    </footer>
  </aside>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
